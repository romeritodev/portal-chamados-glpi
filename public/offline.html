<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem internet — Suporte de TI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:#f9fafb;color:#111827;
  }
  .cartao{max-width:26rem;text-align:center;background:#fff;border-radius:16px;padding:32px 24px;
    box-shadow:0 1px 2px rgb(16 24 40/.05),0 8px 24px rgb(16 24 40/.08)}
  .emoji{font-size:56px;line-height:1}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#4b5563}
  ul{text-align:left;margin:16px 0 0;padding-left:20px;color:#4b5563;font-size:15px}
  li{margin-bottom:6px}
  button{
    margin-top:24px;width:100%;min-height:48px;border:0;border-radius:10px;
    background:#1d4ed8;color:#fff;font:inherit;font-weight:600;cursor:pointer;
  }
  button:hover{background:#1e40af}
  .rodape{margin-top:16px;font-size:13px;color:#6b7280}
</style>
</head>
<body>
  <div class="cartao">
    <div class="emoji" aria-hidden="true">📡</div>
    <h1>Sem conexão com a internet</h1>
    <p>O Suporte de TI precisa de internet para mostrar seus chamados.</p>
    <ul>
      <li>Verifique o Wi-Fi ou os dados do celular</li>
      <li>Se estiver no computador, confira o cabo de rede</li>
      <li>Assim que voltar, toque no botão abaixo</li>
    </ul>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
    <p class="rodape">Se a internet do setor caiu, avise a TI por telefone.</p>
  </div>
</body>
</html>
